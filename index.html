<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Page Builder · Outmarket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./host-shell.css" />
    <style>[hidden] { display: none !important; } .member-card.is-template-focus { border: 2px solid #685ae2; padding: 20px; } .property-subtitle { margin: 3px 0 0; color: #858796; font-size: 11px; } .property-stepper, .property-align, .property-visibility { display: flex; align-items: center; justify-content: space-between; min-height: 34px; border-bottom: 1px solid #f0f0f4; color: #5f6170; font-size: 12px; } .property-stepper > div, .property-align > div { display: flex; align-items: center; gap: 3px; } .property-stepper button, .property-align button { min-width: 25px; height: 24px; padding: 0 6px; border: 1px solid #e3e3eb; border-radius: 4px; background: #fff; color: #555768; font-size: 12px; } .property-stepper output { display: inline-block; min-width: 38px; text-align: center; color: #333544; font: 11px 'DM Mono', monospace; } .property-align button.is-active, .card-style-options button.is-active { border-color: #8b7ff1; background: #f1efff; color: #5546c9; } .property-visibility em { margin-left: 5px; color: #999baa; font: 9px 'DM Mono', monospace; } .property-visibility button, .compact-content-field button { border: 0; background: transparent; color: #6d5fdb; font-size: 14px; } .compact-content-field { position: relative; display: grid; gap: 4px; margin-bottom: 12px; color: #656776; font-size: 11px; } .compact-content-field input, .compact-content-field textarea { width: 100%; min-height: 31px; padding: 6px 32px 6px 8px; border: 1px solid #dfe0e8; border-radius: 5px; color: #343645; font-size: 12px; } .compact-content-field textarea { min-height: 54px; resize: vertical; } .compact-content-field button { position: absolute; right: 4px; bottom: 4px; } .card-style-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 14px; } .card-style-options button { display: grid; gap: 3px; min-height: 48px; padding: 5px 2px; border: 1px solid #e2e2ea; border-radius: 5px; background: #fff; color: #6a6c7b; font-size: 8px; } .card-style-options strong { font-size: 16px; font-weight: 500; } .template-source { display: grid; gap: 5px; margin-bottom: 10px; color: #686a79; font-size: 11px; } .template-source select { width: 100%; min-height: 32px; border: 1px solid #dfe0e8; border-radius: 5px; background: #fff; padding: 6px 8px; color: #343645; font-size: 12px; } .template-source small { color: #999ba7; font-size: 10px; }</style>
    <style>.card-template-note { margin-bottom: 12px !important; } .property-color, .property-select { display: flex; align-items: center; justify-content: space-between; min-height: 34px; border-bottom: 1px solid #f0f0f4; color: #5f6170; font-size: 12px; } .property-color > span:last-child { display: flex; align-items: center; gap: 7px; } .property-color input { width: 24px; height: 24px; padding: 1px; border: 1px solid #dfe0e8; border-radius: 5px; background: #fff; } .property-color code { min-width: 55px; color: #777989; font: 10px 'DM Mono', monospace; } .property-select select { width: 115px; height: 26px; border: 1px solid #dfe0e8; border-radius: 4px; background: #fff; color: #4c4e5c; font-size: 11px; } .member-card.has-card-selection { outline: 1px dashed #685ae2; outline-offset: 0; } .member-card.has-card-selection.is-template-focus { outline: 2px solid #685ae2; } .member-card.is-horizontal-card { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 14px; align-items: start; } .member-card.is-horizontal-card .member-card__photo { grid-row: span 2; } .member-card.is-horizontal-card .member-card__details { grid-column: 2; } </style>
    <style>.property-color { position: relative; } .property-color-trigger { display: flex; align-items: center; gap: 6px; min-width: 118px; height: 26px; padding: 3px 6px; border: 1px solid #dfe0e8; border-radius: 5px; background: #fff; text-align: left; } .property-color-trigger i { position: relative; display: block; width: 16px; height: 16px; overflow: hidden; border: 1px solid rgba(0, 0, 0, .16); border-radius: 3px; background-image: linear-gradient(45deg, #d9d9d9 25%, transparent 25%), linear-gradient(-45deg, #d9d9d9 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #d9d9d9 75%), linear-gradient(-45deg, transparent 75%, #d9d9d9 75%); background-size: 8px 8px; background-position: 0 0, 0 4px, 4px -4px, -4px 0; } .property-color-trigger i:after { position: absolute; inset: 0; content: ''; background: var(--swatch-color); } .property-color-trigger code { min-width: 50px; font-size: 9px; } .property-color-trigger small { margin-left: auto; color: #777989; font-size: 9px; } .color-picker { position: absolute; z-index: 30; top: calc(100% + 7px); right: 0; width: 264px; padding: 12px; border: 1px solid #e3e2e8; border-radius: 10px; background: #fff; box-shadow: 0 14px 34px rgba(27, 29, 29, .20); } .color-picker__plane { position: relative; height: 176px; overflow: hidden; border-radius: 7px; background: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, hsl(var(--picker-hue), 100%, 50%)); cursor: crosshair; } .color-picker__plane i { position: absolute; width: 16px; height: 16px; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 2px rgba(0, 0, 0, .55); transform: translate(-50%, -50%); } .color-picker__range { display: grid; grid-template-columns: 1fr; gap: 4px; margin-top: 10px; } .color-picker__range span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } .color-picker__range input { width: 100%; height: 14px; margin: 0; accent-color: #e5372c; } .color-picker__hue input { background: linear-gradient(90deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); border-radius: 99px; } .color-picker__alpha { padding: 4px; border-radius: 5px; background: conic-gradient(#d4d4d4 25%, #fff 0 50%, #d4d4d4 0 75%, #fff 0) 0/10px 10px; } .color-picker__alpha input { accent-color: #333; } .color-picker__value { display: flex; align-items: center; gap: 8px; margin-top: 11px; padding: 5px 7px; border: 1px solid #deddd8; border-radius: 6px; background: #faf9f6; } .color-picker__value button { width: 24px; height: 24px; border: 0; background: transparent; color: #676978; font-size: 17px; } .color-picker__value input { flex: 1; min-width: 0; border: 0; border-right: 1px solid #dfddd8; outline: 0; background: transparent; color: #34343e; font: 17px 'DM Mono', monospace; } .color-picker__value output { min-width: 39px; text-align: right; color: #34343e; font: 16px 'DM Mono', monospace; }</style>
  </head>
  <body>
    <main class="app-shell figma-shell" aria-label="Team page builder">
      <aside class="figma-nav" aria-label="Primary navigation">
        <div class="figma-logo"><img src="./assets/outmarket-sidebar-mark.svg" alt="Outmarket"></div><div class="figma-nav__rule"></div>
        <div class="figma-nav__group"><button aria-label="Workspace"><i data-lucide="layout-dashboard"></i></button><button aria-label="Documents"><i data-lucide="file-text"></i></button><button aria-label="Benefits"><i data-lucide="heart-handshake"></i></button><button aria-label="Policies"><i data-lucide="shield-check"></i></button><button aria-label="Teams" class="is-active"><i data-lucide="users-round"></i></button><button aria-label="Assistant"><i data-lucide="sparkles"></i></button><button aria-label="Checklist"><i data-lucide="list-checks"></i></button></div>
        <div class="figma-nav__rule"></div><div class="figma-nav__group"><button aria-label="Messages"><i data-lucide="messages-square"></i></button><button aria-label="360 view"><i data-lucide="circle-gauge"></i></button><button aria-label="Analytics"><i data-lucide="chart-no-axes-combined"></i></button><button aria-label="Reports"><i data-lucide="chart-column-big"></i></button><button aria-label="Opportunities"><i data-lucide="diamond"></i></button><button aria-label="Data"><i data-lucide="database"></i></button></div><div class="figma-nav__rule"></div><button class="figma-nav__bottom" aria-label="Dashboard"><i data-lucide="panels-top-left"></i></button>
      </aside>
      <section class="figma-content">
        <header class="figma-header"><div class="figma-breadcrumbs"><span>Proposals</span><b><i data-lucide="chevron-right"></i></b><span>Team pages</span><b><i data-lucide="chevron-right"></i></b><strong>Team Page Name</strong></div><div class="figma-header__actions"><button aria-label="Saved items"><i data-lucide="bookmark"></i></button><button aria-label="Notes"><i data-lucide="sticky-note"></i></button><button aria-label="Notifications"><i data-lucide="bell"></i><i></i></button><span class="figma-user">ML</span></div></header>
        <header class="function-header"><h1>Team Page Name</h1><div><a class="button button--ghost" href="./template.html">Template demo</a><button class="button button--ghost">Discard</button><button class="button button--primary" id="save-page-top"><i data-lucide="plus"></i> Save</button></div></header>
        <section class="figma-canvas"><div class="builder-container">
      <section class="builder">
        <aside class="left-panel" aria-label="Builder structure and members">
          <section class="structure-section"><div class="section-title"><span>Structure</span><span class="section-title__note">design slots</span></div><div id="structure-list" class="structure-list"></div></section>
          <section class="members-section"><div class="section-title"><span>Members</span><span id="member-total" class="count">6</span></div><div class="team-selector-control"><button id="team-selector-toggle" class="team-selector-toggle" aria-expanded="false"><span id="active-team-name">Marketing Team</span><i data-lucide="chevrons-up-down"></i></button><div id="team-selector-menu" class="team-selector-menu" hidden></div></div><div id="members-list" class="members-list"></div><div class="member-actions"><div class="add-member-wrap"><button id="add-placeholder" class="add-member"><i data-lucide="plus"></i> Add member</button></div><div id="team-save-control" class="team-save-control" hidden><button id="team-save-toggle" class="team-save-toggle" aria-expanded="false"><i data-lucide="save" aria-hidden="true"></i><span>Save team</span></button><div id="team-save-menu" class="team-save-menu" hidden></div></div></div></section>
        </aside>
        <section class="canvas" id="canvas" aria-label="Team page canvas">
          <div class="canvas-toolbar"><span>Team page</span><span class="canvas-toolbar__right">100%</span></div>
          <div class="canvas-scroll"><article class="page-sheet" id="page-sheet"><div class="team-page" id="team-page"></div></article></div>
          <div id="card-caption" class="template-caption" hidden></div>
        </section>
        <aside class="properties-panel" id="properties-panel" aria-label="Properties"></aside>
      </section>
        </div></section>
      </section>
    </main>
    <div id="template-modal" class="modal-layer" hidden>
      <section class="template-modal" role="dialog" aria-modal="true" aria-labelledby="template-modal-title">
        <header class="template-modal__head"><div><p class="eyebrow">PROPOSAL TEMPLATE</p><h2 id="template-modal-title">Configure team page</h2></div><button class="icon-button" data-close-modal aria-label="Close modal"><i data-lucide="x"></i></button></header>
        <div class="template-modal__body"><div class="template-preview-wrap"><div class="preview-label"><span class="live-dot"></span> Live preview</div><div class="template-preview-sheet"><div id="template-preview" class="team-page team-page--preview"></div></div></div><aside id="template-properties" class="properties-panel properties-panel--modal"></aside></div>
        <footer class="template-modal__foot"><button class="button button--ghost" id="apply-overrides">Apply 3 example overrides</button><div><button class="button button--ghost" data-close-modal>Cancel</button><button class="button button--primary">Apply to proposal</button></div></footer>
      </section>
    </div>
    <div id="confirm-dialog" class="confirm-layer" hidden><section class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title"><span class="confirm-icon">!</span><h2 id="confirm-title">Change source team?</h2><p>Member-level changes made for this proposal will reset when you change teams.</p><div><button class="button button--ghost" id="cancel-team-change">Cancel</button><button class="button button--danger" id="confirm-team-change">Change team</button></div></section></div>
    <script src="./assets/vendor/lucide.min.js"></script>
    <script src="./script.js"></script>
    <script src="./grid-settings.js"></script>
  </body>
</html>
